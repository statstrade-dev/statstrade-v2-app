name: Notify central CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify application CI and deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: statstrade-dev/statstrade-v2-ci
          event-type: app-changed
          client-payload: >-
            {
              "source": "statstrade-v2-app",
              "app_ref": "${{ github.ref }}",
              "app_sha": "${{ github.sha }}",
              "root_ref": "refs/heads/main",
              "area": "app"
            }
          
